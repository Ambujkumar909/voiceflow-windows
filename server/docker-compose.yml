# VoiceFlow server + PostgreSQL on one host.
#   1. npm run init-secrets            (creates ./secrets; then paste your Deepgram key into
#                                       secrets/deepgram_api_key)
#   2. docker compose up -d --build
# Put a TLS proxy or an AWS ALB in front of port 8787; never expose plain HTTP publicly.
name: voiceflow

services:
  db:
    image: postgres:18.4-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [db_admin_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend] # no published port, no internet access
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d voiceflow"] # TCP: not ready during first-run init
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build: .
    image: voiceflow-server:1.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: postgres://voiceflow@db:5432/voiceflow
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PASSWORD_PEPPER_FILE: /run/secrets/password_pepper
      DEEPGRAM_API_KEY_FILE: /run/secrets/deepgram_api_key
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      DAILY_AUDIO_CAP_SEC: ${DAILY_AUDIO_CAP_SEC:-14400}
    secrets: [db_app_password, jwt_secret, password_pepper, deepgram_api_key]
    networks: [backend, egress] # egress: Deepgram (and the optional LLM) only
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s

networks:
  backend:
    internal: true
  egress: {}

volumes:
  pgdata:

# Files in ./secrets (created by `npm run init-secrets`, never committed, never in the image).
secrets:
  db_admin_password: { file: ./secrets/db_admin_password }
  db_app_password: { file: ./secrets/db_app_password }
  jwt_secret: { file: ./secrets/jwt_secret }
  password_pepper: { file: ./secrets/password_pepper }
  deepgram_api_key: { file: ./secrets/deepgram_api_key }
